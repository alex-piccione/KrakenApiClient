name: Deploy http-client branch

on:
  push:
    branches: ["http-client"]
  workflow_dispatch:  # Adds "Run workflow" button

env:
  PROJECT_FOLDER: src/KrakenApiClient
  NUGET_API_KEY: ${{secrets.NUGET_API_KEY}}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📦 Checkout code
      uses: actions/checkout@v5
  
    - name: ⚙️ Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: 🔍 Whhich branch is this?
      run: |
        #echo "Branch: ${{ github.ref }}"
        echo github.ref:: ${{github.ref}}

    - name: 🔄 Restore packages
      run: dotnet restore

    - name: 🏗️ Build
      run: dotnet build --configuration Release --no-restore

    - name: 🧪 Run Tests
      run: |
        dotnet test --no-restore --configuration Release \
          --filter "TestCategory!=SKIP_ON_DEPLOY & TestCategory!=REQUIRES_API_KEY" \
          #--logger "GitHubActions" 
     
    - name: 🎯 Define NuGet package version
      run: |
        # MAJOR.MINOR.PATCH-BUILD-LABEL  // accepted SemVer format
        BASE_VERSION=$(date +'%y.%-m.%-d') # e.g., 25.3.5
        BUILD_NUMBER="${{ github.run_number }}"  # e.g., 123456
        NUGET_PACKAGE_VERSION="${BASE_VERSION}-${BUILD_NUMBER}"  # e.g., 25.3.5-123456

        # Append -alpha for non-main branches
        if [[ ${{ github.ref }} != "refs/heads/main" ]]; then
          NUGET_PACKAGE_VERSION="${NUGET_PACKAGE_VERSION}-alpha"  # e.g., 25.3.5-123456-alpha
        fi

        echo "NUGET_PACKAGE_VERSION=$NUGET_PACKAGE_VERSION" >> $GITHUB_ENV
        #echo "📦 NUGET PACKAGE VERSION: $NUGET_PACKAGE_VERSION" >> $GITHUB_OUTPUT
    
    - name: 📦 Pack NuGet
      run: |
        echo create package $NUGET_PACKAGE_VERSION
        dotnet pack $PROJECT_FOLDER --configuration Release --no-build 
          -p:PackageVersion=$NUGET_PACKAGE_VERSION
          -o ./nupkgs

    - name: 🚀 Publish NuGet
      run: |
        echo "publish $NUGET_PACKAGE_VERSION"
        dotnet nuget push ./nupkgs/*.nupkg 
          --api-key "${NUGET_API_KEY}" 
          --source https://api.nuget.org/v3/index.json 
          --skip-duplicate

